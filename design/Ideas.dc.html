<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ideas inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2F0EA;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1012; color: #F2F0EA; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 56px 20px 10px 20px; display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #9A9890; text-transform: uppercase">5 ideas · 2 ready to decide</div>
      <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1">Ideas</h1>
    </div>
    <a href="Capture.dc.html" aria-label="New idea" style="width: 44px; height: 44px; border-radius: 50%; background: #F2F0EA; color: #0F1012; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </div>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 6px 20px 100px 20px; display: flex; flex-direction: column; gap: 10px">

    <div style="font-size: 13px; color: #9A9890; line-height: 1.5; padding: 0 0 4px 0">Ideas sit here for a week before you can promote them. Most should die here. That's the point.</div>

    <sc-for list="{{ideas}}" as="i" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #1C1D21; border: 1px solid #2A2B30">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
          <span style="font-size: 16px; font-weight: 600; line-height: 1.3">{{i.name}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9A9890; white-space: nowrap">{{i.age}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 12px; line-height: 1.4">
          <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9A9890; text-transform: uppercase">The itch</span><span style="color: #D9D7CF">{{i.itch}}</span></div>
          <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9A9890; text-transform: uppercase">For who</span><span style="color: #D9D7CF">{{i.who}}</span></div>
          <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9A9890; text-transform: uppercase">Why now</span><span style="color: #D9D7CF">{{i.why}}</span></div>
          <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9A9890; text-transform: uppercase">Done looks like</span><span style="color: #D9D7CF">{{i.done}}</span></div>
        </div>
        <sc-if value="{{i.ready}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; gap: 8px">
            <button onClick="{{i.kill}}" style="flex: 1 1 0; padding: 10px; border-radius: 10px; background: #26272C; border: 1px solid #34353B; color: #B9B7AF; font-family: inherit; font-size: 13px; font-weight: 500; min-height: 44px; cursor: pointer">Let it go</button>
            <button onClick="{{i.keep}}" style="flex: 1 1 0; padding: 10px; border-radius: 10px; background: #26272C; border: 1px solid #34353B; color: #F2F0EA; font-family: inherit; font-size: 13px; font-weight: 500; min-height: 44px; cursor: pointer">Keep a week</button>
            <button onClick="{{i.promote}}" style="flex: 1 1 0; padding: 10px; border-radius: 10px; background: #F2F0EA; border: none; color: #0F1012; font-family: inherit; font-size: 13px; font-weight: 600; min-height: 44px; cursor: pointer">Promote</button>
          </div>
        </sc-if>
        <sc-if value="{{i.waiting}}" hint-placeholder-val="{{false}}">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9A9890">Decide in {{i.left}}</div>
        </sc-if>
        <sc-if value="{{i.resolved}}" hint-placeholder-val="{{false}}">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6FCF8E">{{i.outcome}}</div>
        </sc-if>
      </div>
    </sc-for>

  </div>

  <div style="position: relative; margin-top: -84px; height: 84px; display: flex; justify-content: space-around; align-items: center; padding: 0 12px 16px 12px; background: #0F1012; border-top: 1px solid #2A2B30; flex: 0 0 auto">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; justify-content: center; color: #9A9890; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Brief
    </a>
    <a href="Board.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; justify-content: center; color: #9A9890; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
      Board
    </a>
    <a href="Ideas.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; justify-content: center; color: #F2F0EA; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5V16h8v-2.5A6 6 0 0012 3z"/></svg>
      Ideas
    </a>
    <a href="Live.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; justify-content: center; color: #9A9890; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      Live
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { out: {} }; }
  renderVals() {
    const base = [
      { id: 'a', name: 'Fermentation app', age: '12d', itch: 'All ferment info in one place', who: 'Home hobbyists', why: 'Already doing it daily', done: 'Paid app on both stores', ready: true },
      { id: 'b', name: 'Cheap bass', age: '8d', itch: 'Want to learn bass', who: 'Me', why: 'Guitar is sticking', done: 'Bass in the house', ready: true },
      { id: 'c', name: 'Kimchi from Irish cabbage', age: '3d', itch: 'Local-ingredient ferment', who: 'Soda customers', why: 'Winter cabbage soon', done: 'One good batch', ready: false, left: '4 days' },
      { id: 'd', name: 'Mountain Leader award', age: '2d', itch: 'Legit lead hikes', who: 'Tours business', why: 'Needed before summer 27', done: 'Booked on a course', ready: false, left: '5 days' },
      { id: 'e', name: 'Sea moss harvest run', age: '1d', itch: 'Have the spots mapped', who: 'Shop vision', why: 'Spring tides', done: 'First dried batch', ready: false, left: '6 days' }
    ];
    const out = this.state.out;
    return {
      ideas: base.map(i => {
        const o = out[i.id];
        return { ...i,
          ready: i.ready && !o, waiting: !i.ready && !o, resolved: !!o,
          outcome: o === 'kill' ? 'Let go — archived' : o === 'keep' ? 'Kept — decide again in 7 days' : 'Promoted — now a project card',
          kill: () => this.setState({ out: { ...out, [i.id]: 'kill' } }),
          keep: () => this.setState({ out: { ...out, [i.id]: 'keep' } }),
          promote: () => this.setState({ out: { ...out, [i.id]: 'promote' } }) };
      })
    };
  }
}
</script>
</body>
</html>
