<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board — all projects by tier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2F0EA;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1012; color: #F2F0EA; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 56px 20px 10px 20px; display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #9A9890; text-transform: uppercase">4 active · 6 practices · 6 shelved</div>
      <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1">Board</h1>
    </div>
    <a href="Capture.dc.html" aria-label="Capture a note" style="width: 44px; height: 44px; border-radius: 50%; background: #F2F0EA; color: #0F1012; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
    </a>
  </div>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 6px 20px 100px 20px; display: flex; flex-direction: column; gap: 10px">

    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #9A9890; text-transform: uppercase; padding: 4px 0 0 0">Active</div>

    <sc-for list="{{active}}" as="c" hint-placeholder-count="4">
      <a href="Project.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; background: #1C1D21; border: 1px solid #2A2B30">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="font-size: 17px; font-weight: 600">{{c.name}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 6px; background: {{c.pillBg}}; color: {{c.pillFg}}; white-space: nowrap">{{c.status}}</span>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 1.4">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: {{c.pillFg}}; flex: 0 0 auto; margin-top: 7px"></span>
          <span>{{c.next}}</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
          <div style="flex: 1 1 auto; height: 4px; border-radius: 2px; background: #2A2B30; overflow: hidden"><div style="width: {{c.pct}}; height: 100%; background: {{c.pillFg}}"></div></div>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9A9890; white-space: nowrap">{{c.ago}}</span>
        </div>
      </a>
    </sc-for>

    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #9A9890; text-transform: uppercase; padding: 14px 0 0 0">Practices · today</div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{practices}}" as="p" hint-placeholder-count="6">
        <button onClick="{{p.toggle}}" aria-label="{{p.name}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px 6px; border-radius: 12px; background: {{p.bg}}; border: 1px solid {{p.border}}; color: #F2F0EA; font-family: inherit; cursor: pointer; min-height: 76px">
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid {{p.ring}}; background: {{p.fill}}; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{p.on}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0F1012" stroke-width="3" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></sc-if>
          </span>
          <span style="font-size: 12px; font-weight: 500; text-align: center; line-height: 1.2">{{p.name}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9A9890">{{p.streak}}</span>
        </button>
      </sc-for>
    </div>

    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #9A9890; text-transform: uppercase; padding: 14px 0 0 0">Shelf</div>

    <a href="Live.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #16171A; border: 1px solid #22232A; color: #B9B7AF">
      <span style="font-size: 13px; line-height: 1.4">Adventure tours · Fermentation app · Orion · Momentum Digital · Mission · Garden</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex: 0 0 auto"><path d="M9 6l6 6-6 6"/></svg>
    </a>

  </div>

  <div style="position: relative; margin-top: -84px; height: 84px; display: flex; justify-content: space-around; align-items: center; padding: 0 12px 16px 12px; background: #0F1012; border-top: 1px solid #2A2B30; flex: 0 0 auto">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; justify-content: center; color: #9A9890; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Brief
    </a>
    <a href="Board.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; justify-content: center; color: #F2F0EA; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
      Board
    </a>
    <a href="Ideas.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; justify-content: center; color: #9A9890; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5V16h8v-2.5A6 6 0 0012 3z"/></svg>
      Ideas
    </a>
    <a href="Live.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; justify-content: center; color: #9A9890; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      Live
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { done: { gym: true, irish: true } }; }
  renderVals() {
    const S = {
      building: { bg: '#2B2311', fg: '#F0B64A' },
      planning: { bg: '#13232B', fg: '#5AB6E0' },
      ongoing:  { bg: '#15281C', fg: '#6FCF8E' }
    };
    const active = [
      { name: 'Sales Arena', status: 'building', next: 'Stripe checkout live on PRO CARD', pct: 70, ago: 'yesterday' },
      { name: 'Voice AI for businesses', status: 'planning', next: 'Pick one niche, build the demo agent', pct: 15, ago: '3 days' },
      { name: 'Irish phrase app', status: 'building', next: 'Test Irish speech-to-text options', pct: 30, ago: 'yesterday' },
      { name: 'Ginger bug sodas', status: 'ongoing', next: 'New bug, try a 4th flavour', pct: 100, ago: '9 days' }
    ].map(c => ({ ...c, status: c.status.toUpperCase(), pillBg: S[c.status].bg, pillFg: S[c.status].fg, pct: c.pct + '%' }));

    const base = [
      { id: 'gym', name: 'Gym / surf', streak: '4d' },
      { id: 'guitar', name: 'Guitar', streak: '2d' },
      { id: 'irish', name: 'Irish', streak: '6d' },
      { id: 'skate', name: 'Skate', streak: 'Sat' },
      { id: 'ferments', name: 'Ferments', streak: 'due' },
      { id: 'garden', name: 'Garden', streak: 'Sun' }
    ];
    const done = this.state.done;
    return {
      active,
      practices: base.map(p => {
        const on = !!done[p.id];
        return { ...p, on,
          bg: on ? '#15281C' : '#1C1D21', border: on ? '#2E5A3C' : '#2A2B30',
          ring: on ? '#6FCF8E' : '#4A4B52', fill: on ? '#6FCF8E' : 'transparent',
          toggle: () => this.setState({ done: { ...done, [p.id]: !on } }) };
      })
    };
  }
}
</script>
</body>
</html>
